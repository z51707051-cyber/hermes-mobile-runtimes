name: Android native wheel feasibility
on:
  pull_request:
    paths:
      - 'experiments/android-native-wheels/**'
      - 'experiments/android-hermes-import-probe/**'
      - 'apps/hermes-mobile-internal/**'
      - 'apps/mobile-bridge-android/app/src/main/**'
      - 'tools/android_phone_tools.py'
      - 'toolsets.py'
      - '.github/workflows/android-native-wheels.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-wheels-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build-wheel:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        package: [cryptography, jiter, pydantic-core, pillow, psutil, rpds-py, ruamel-yaml-clib]
        arch: [arm64_v8a, x86_64]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: '0.9.28'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          accept-android-sdk-licenses: false
          packages: ''
      - name: Accept SDK licenses without bounded stdin
        run: yes | sdkmanager --licenses >/dev/null || true
      - name: Install hash-locked wheel tooling
        run: |
          set -euo pipefail
          uv venv --python 3.12 build-wheel-env
          uv pip install --no-config --python build-wheel-env/bin/python --require-hashes \
            -r experiments/android-native-wheels/build-requirements.lock
      - name: Fetch hash-pinned source
        id: source
        env:
          PACKAGE_NAME: ${{ matrix.package }}
        run: |
          set -euo pipefail
          source_path=$(python3 experiments/android-native-wheels/prepare_source.py \
            "$PACKAGE_NAME" "$RUNNER_TEMP/hermes-wheel-source")
          echo "path=$source_path" >> "$GITHUB_OUTPUT"
      - name: Add Rust Android target
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          case "$TARGET_ARCH" in
            arm64_v8a) rust_target=aarch64-linux-android ;;
            x86_64) rust_target=x86_64-linux-android ;;
            *) exit 2 ;;
          esac
          rustup target add "$rust_target"
      - name: Cross-compile CPython 3.13 Android wheel
        id: wheel-build
        env:
          ANDROID_API_LEVEL: '24'
          CIBW_BUILD_FRONTEND: 'build[uv]'
          CIBW_XBUILD_TOOLS: 'rustc cargo rustup'
          CIBW_BUILD_VERBOSITY: '1'
          SOURCE_PATH: ${{ steps.source.outputs.path }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -uo pipefail
          mkdir -p wheelhouse
          mkdir -p wheel-evidence
          set +e
          build-wheel-env/bin/python -m cibuildwheel \
            --only "cp313-android_${TARGET_ARCH}" \
            --output-dir wheelhouse \
            "$SOURCE_PATH" 2>&1 | tee wheel-evidence/build.log
          build_status=${PIPESTATUS[0]}
          set -e
          if [[ "$build_status" == 0 ]]; then
            echo 'built=true' >> "$GITHUB_OUTPUT"
            echo 'wheel_build=passed' > wheel-evidence/status.txt
            sha256sum wheelhouse/*.whl | tee wheelhouse/SHA256SUMS
          else
            echo 'built=false' >> "$GITHUB_OUTPUT"
            echo "wheel_build=failed exit=$build_status" > wheel-evidence/status.txt
            echo '::warning::Exact Android wheel build failed; see the evidence artifact.'
          fi
          exit 0
      - name: Upload private wheel evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-wheel-${{ matrix.package }}-${{ matrix.arch }}
          path: |
            wheelhouse/
            wheel-evidence/
          if-no-files-found: warn
          retention-days: 14

  package-and-import-hermes:
    needs: build-wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: android-wheel-*
          path: android-wheel-artifacts
      - name: Collect and verify bootstrap wheels
        run: |
          set -euo pipefail
          wheelhouse=experiments/android-hermes-import-probe/app/android-wheelhouse
          evidence=experiments/android-hermes-import-probe/evidence
          mkdir -p "$wheelhouse" "$evidence"
          find android-wheel-artifacts -type f -name '*.whl' -exec cp '{}' "$wheelhouse/" ';'
          python3 - <<'PY'
          from pathlib import Path
          wheels = sorted(path.name for path in Path(
              "experiments/android-hermes-import-probe/app/android-wheelhouse"
          ).glob("*.whl"))
          for package in ("jiter", "pydantic_core", "rpds_py", "ruamel_yaml_clib"):
              for abi in ("arm64_v8a", "x86_64"):
                  if not any(name.startswith(package + "-") and f"android_24_{abi}" in name for name in wheels):
                      raise SystemExit(f"missing exact bootstrap wheel: {package} {abi}")
          if len(wheels) != 8:
              raise SystemExit(f"unexpected bootstrap wheel count: {len(wheels)}")
          PY
          sha256sum "$wheelhouse"/*.whl | tee "$evidence/bootstrap-wheel-sha256.txt"
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: '0.9.28'
      - run: uv python install 3.13
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          accept-android-sdk-licenses: false
          packages: ''
      - name: Install Android 15 test environment
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'emulator' 'system-images;android-35;google_apis;x86_64'
      - name: Stage the actual Hermes import surface
        run: |
          set -euo pipefail
          target=experiments/android-hermes-import-probe/app/src/generated/python
          mkdir -p "$target"
          # Stage every first-party package reachable from the Agent runtime.
          # Several paths (including tool execution) import gateway session
          # context lazily, so an import-only smoke test is not sufficient.
          runtime_packages=(
            acp_adapter agent cron gateway hermes_cli hermes_mobile
            plugins providers tools tui_gateway
          )
          cp -R "${runtime_packages[@]}" "$target/"
          find . -maxdepth 1 -type f -name '*.py' -exec cp '{}' "$target/" ';'
          test -f "$target/gateway/session_context.py"
          test -f "$target/tools/tool_search.py"
          kotlin_target=experiments/android-hermes-import-probe/app/src/main/kotlin
          mkdir -p "$kotlin_target"
          cp -R apps/mobile-bridge-android/app/src/main/kotlin/. "$kotlin_target/"
      - name: Package actual Hermes bootstrap set
        id: import-build
        run: |
          set -uo pipefail
          probe_dir=experiments/android-hermes-import-probe
          export PATH="$(dirname "$(uv python find 3.13)"):$PATH"
          set +e
          apps/mobile-bridge-android/gradlew -p "$probe_dir" --no-daemon \
            --write-locks --write-verification-metadata sha256 \
            :app:assembleDebug :app:assembleDebugAndroidTest \
            2>&1 | tee "$probe_dir/evidence/package.log"
          build_status=${PIPESTATUS[0]}
          set -e
          if [[ "$build_status" == 0 ]]; then
            echo 'built=true' >> "$GITHUB_OUTPUT"
            echo 'bootstrap_package=passed' > "$probe_dir/evidence/import-status.txt"
          else
            echo 'built=false' >> "$GITHUB_OUTPUT"
            echo "bootstrap_package=failed exit=$build_status" > "$probe_dir/evidence/import-status.txt"
            echo '::warning::Hermes bootstrap package failed; see import evidence.'
          fi
          exit 0
      - name: Execute the launcher embedded-runtime route on Android 15
        if: steps.import-build.outputs.built == 'true'
        run: |
          set -euo pipefail
          probe_dir=experiments/android-hermes-import-probe
          export ANDROID_AVD_HOME="$RUNNER_TEMP/hermes-import-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --name hermes-import \
            --package 'system-images;android-35;google_apis;x86_64' --device pixel_2
          if [[ -e /dev/kvm ]]; then sudo chmod 666 /dev/kvm; fi
          "$ANDROID_SDK_ROOT/emulator/emulator" -avd hermes-import \
            -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect \
            > "$probe_dir/evidence/emulator.log" 2>&1 &
          import_pid=$!
          trap 'kill "$import_pid" 2>/dev/null || true' EXIT
          deadline=$((SECONDS + 240))
          booted=false
          while (( SECONDS < deadline )); do
            kill -0 "$import_pid"
            if [[ "$(timeout 10s adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" == 1 ]]; then
              booted=true
              break
            fi
            sleep 2
          done
          test "$booted" = true
          adb install "$probe_dir/app/build/outputs/apk/debug/app-debug.apk"
          adb install "$probe_dir/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
          timeout 120s adb shell am instrument -w \
            ai.hermes.runtime.importprobe.test/ai.hermes.runtime.importprobe.ImportInstrumentation \
            | tee "$probe_dir/evidence/instrumentation.txt"
          grep -q 'HERMES_AGENT_ANDROID_TOOL_ROUTE_PASS' "$probe_dir/evidence/instrumentation.txt"
          ! grep -q 'HERMES_AGENT_ANDROID_TOOL_ROUTE_FAIL' "$probe_dir/evidence/instrumentation.txt"
          echo 'agent_android_tool_route=passed' >> "$probe_dir/evidence/import-status.txt"
          echo 'launcher_embedded_runtime=passed' >> "$probe_dir/evidence/import-status.txt"
      - name: Upload Hermes import evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hermes-android-bootstrap-import
          path: |
            experiments/android-hermes-import-probe/evidence/
            experiments/android-hermes-import-probe/app/build/outputs/apk/
            experiments/android-hermes-import-probe/gradle/verification-metadata.xml
            experiments/android-hermes-import-probe/app/gradle.lockfile
            experiments/android-hermes-import-probe/gradle.lockfile
          retention-days: 14

  build-internal-arm64-apk:
    needs: build-wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: android-wheel-*-arm64_v8a
          path: android-wheel-artifacts
      - name: Collect and verify ARM64 bootstrap wheels
        run: |
          set -euo pipefail
          project=apps/hermes-mobile-internal
          wheelhouse="$project/app/android-wheelhouse"
          evidence="$project/evidence"
          mkdir -p "$wheelhouse" "$evidence"
          find android-wheel-artifacts -type f -name '*.whl' -exec cp '{}' "$wheelhouse/" ';'
          python3 - <<'PY'
          from pathlib import Path

          wheelhouse = Path("apps/hermes-mobile-internal/app/android-wheelhouse")
          wheels = sorted(path.name for path in wheelhouse.glob("*.whl"))
          required = ("jiter", "pydantic_core", "rpds_py", "ruamel_yaml_clib")
          for package in required:
              if not any(
                  name.startswith(package + "-") and "android_24_arm64_v8a" in name
                  for name in wheels
              ):
                  raise SystemExit(f"missing exact ARM64 bootstrap wheel: {package}")
          if any("x86" in name or "armeabi" in name for name in wheels):
              raise SystemExit("non-ARM64 wheel entered the internal package input")
          PY
          sha256sum "$wheelhouse"/*.whl | LC_ALL=C sort \
            > "$evidence/bootstrap-wheel-sha256.txt"
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: '0.9.28'
      - run: uv python install 3.13
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          accept-android-sdk-licenses: false
          packages: ''
      - name: Install pinned Android build packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Stage reviewed Hermes runtime sources
        run: |
          set -euo pipefail
          target=apps/hermes-mobile-internal/app/src/generated/python
          mkdir -p "$target"
          runtime_packages=(
            acp_adapter agent cron gateway hermes_cli hermes_mobile
            plugins providers tools tui_gateway
          )
          cp -R "${runtime_packages[@]}" "$target/"
          find . -maxdepth 1 -type f -name '*.py' -exec cp '{}' "$target/" ';'
          test -f "$target/run_agent.py"
          test -f "$target/gateway/session_context.py"
          test -f "$target/tools/android_phone_tools.py"
          find "$target" -type f -name '*.pyc' -delete
          find "$target" -type d -name '__pycache__' -empty -delete
      - name: Build and strictly verify installable APK
        run: |
          set -euo pipefail
          project=apps/hermes-mobile-internal
          export PATH="$(dirname "$(uv python find 3.13)"):$PATH"
          echo "497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7  apps/mobile-bridge-android/gradle/wrapper/gradle-wrapper.jar" \
            | sha256sum -c -
          apps/mobile-bridge-android/gradlew -p "$project" --no-daemon \
            --write-locks --write-verification-metadata sha256 \
            :app:lintDebug :app:assembleDebug
          apps/mobile-bridge-android/gradlew -p "$project" --no-daemon \
            --dependency-verification=strict \
            :app:lintDebug :app:assembleDebug
      - name: Inspect authority, ABI and packaged runtime
        run: |
          set -euo pipefail
          project=apps/hermes-mobile-internal
          apk="$project/app/build/outputs/apk/debug/app-debug.apk"
          evidence="$project/evidence"
          mkdir -p "$evidence/apk" "$evidence/dependency-metadata/gradle" "$evidence/dependency-metadata/app"
          test "$(apkanalyzer manifest application-id "$apk")" = 'ai.hermes.mobile.runtime'
          apkanalyzer manifest print "$apk" > "$evidence/apk/AndroidManifest.xml"
          apkanalyzer files list "$apk" | LC_ALL=C sort > "$evidence/apk/packaged-files.txt"
          find "$project/app/build/reports" -type f -name 'lint-results-*' \
            -exec cp '{}' "$evidence/apk/" ';'
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2" dump resources "$apk" \
            > "$evidence/apk/resource-table.txt"
          python3 scripts/android/verify_android_manifest_policy.py \
            --network-security-config apps/mobile-bridge-android/app/src/main/res/xml/network_security_config.xml \
            --accessibility-service-config apps/mobile-bridge-android/app/src/main/res/xml/current_app_accessibility_service.xml \
            --full-backup-rules apps/mobile-bridge-android/app/src/main/res/xml/backup_rules.xml \
            --data-extraction-rules apps/mobile-bridge-android/app/src/main/res/xml/data_extraction_rules.xml \
            --compiled-resource-table "$evidence/apk/resource-table.txt" \
            "$evidence/apk/AndroidManifest.xml"
          grep -Eq '(^|/)lib/arm64-v8a/.*(python|chaquopy)' "$evidence/apk/packaged-files.txt"
          if grep -Eq '(^|/)lib/(x86|x86_64|armeabi|armeabi-v7a)/' "$evidence/apk/packaged-files.txt"; then
            echo 'unexpected non-ARM64 native library in internal APK' >&2
            exit 1
          fi
          if grep -Ei '(\.env($|/)|\.pem$|\.key$|\.p12$|\.jks$|\.keystore$|credentials\.json$|secrets\.json$)' "$evidence/apk/packaged-files.txt"; then
            echo 'forbidden secret-bearing file type found in internal APK' >&2
            exit 1
          fi
          cp "$project/gradle/verification-metadata.xml" "$evidence/dependency-metadata/gradle/"
          cp "$project/app/gradle.lockfile" "$evidence/dependency-metadata/app/"
          cp "$project/gradle.lockfile" "$evidence/dependency-metadata/"
          output="$evidence/Hermes-Mobile-alpha-arm64-v8a.apk"
          cp "$apk" "$output"
          sha256sum "$output" > "$evidence/Hermes-Mobile-alpha-arm64-v8a.apk.sha256"
          stat --printf='%s bytes\n' "$output" > "$evidence/Hermes-Mobile-alpha-arm64-v8a.apk.size"
      - name: Upload installable ARM64 internal package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hermes-mobile-internal-arm64
          path: apps/hermes-mobile-internal/evidence/
          if-no-files-found: error
          retention-days: 14
