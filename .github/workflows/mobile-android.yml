name: Mobile protocol and Android security kernel

on:
  pull_request:
    paths:
      - "apps/mobile-bridge-android/**"
      - "hermes_mobile/**"
      - "scripts/android/**"
      - "scripts/mobile/**"
      - "tests/mobile/**"
      - "third_party/**"
      - "docs/testing/android-bootstrap.md"
      - "docs/testing/hmr-102-device-security.md"
      - "docs/testing/hmr-103-protocol.md"
      - "docs/testing/hmr-104-capability-router.md"
      - "docs/testing/hmr-105-current-app.md"
      - "docs/testing/hmr-106-phone-state.md"
      - "docs/testing/hmr-107-durable-audit.md"
      - "docs/testing/hmr-108-read-screen.md"
      - "docs/testing/hmr-109-screenshot.md"
      - "docs/testing/hmr-110-navigation.md"
      - "docs/testing/hmr-111-notifications-device-state.md"
      - "docs/testing/hmr-112-bounded-wait.md"
      - "docs/testing/hmr-113-emulator-contract.md"
      - "docs/protocol/**"
      - "docs/adr/0002-mobile-agent-protocol-v0.1.md"
      - "docs/adr/0004-phone-state-consistency-and-artifact-storage.md"
      - "pyproject.toml"
      - "uv.lock"
      - "docs/adr/0005-device-identity-transport-and-key-rotation.md"
      - "docs/adr/0007-encrypted-append-only-audit-ledger.md"
      - "docs/adr/0008-bounded-semantic-ui-capture.md"
      - "docs/adr/0009-protected-screenshot-capture.md"
      - "docs/adr/0010-state-bound-navigation-actions.md"
      - "docs/adr/0011-notification-and-device-state-observation.md"
      - "docs/adr/0012-bounded-cancellable-wait.md"
      - ".github/workflows/mobile-android.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile-bridge-android/**"
      - "hermes_mobile/**"
      - "scripts/android/**"
      - "scripts/mobile/**"
      - "tests/mobile/**"
      - "third_party/**"
      - "docs/testing/android-bootstrap.md"
      - "docs/testing/hmr-102-device-security.md"
      - "docs/testing/hmr-103-protocol.md"
      - "docs/testing/hmr-104-capability-router.md"
      - "docs/testing/hmr-105-current-app.md"
      - "docs/testing/hmr-106-phone-state.md"
      - "docs/testing/hmr-107-durable-audit.md"
      - "docs/testing/hmr-108-read-screen.md"
      - "docs/testing/hmr-109-screenshot.md"
      - "docs/testing/hmr-110-navigation.md"
      - "docs/testing/hmr-111-notifications-device-state.md"
      - "docs/testing/hmr-112-bounded-wait.md"
      - "docs/testing/hmr-113-emulator-contract.md"
      - "docs/protocol/**"
      - "docs/adr/0002-mobile-agent-protocol-v0.1.md"
      - "docs/adr/0004-phone-state-consistency-and-artifact-storage.md"
      - "pyproject.toml"
      - "uv.lock"
      - "docs/adr/0005-device-identity-transport-and-key-rotation.md"
      - "docs/adr/0007-encrypted-append-only-audit-ledger.md"
      - "docs/adr/0008-bounded-semantic-ui-capture.md"
      - "docs/adr/0009-protected-screenshot-capture.md"
      - "docs/adr/0010-state-bound-navigation-actions.md"
      - "docs/adr/0011-notification-and-device-state-observation.md"
      - "docs/adr/0012-bounded-cancellable-wait.md"
      - ".github/workflows/mobile-android.yml"

permissions:
  contents: read

concurrency:
  group: mobile-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  protocol-contract:
    name: Validate Python protocol and routing contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install locked dependencies
        run: uv sync --locked --extra dev --extra mobile

      - name: Verify schema manifest and formatting
        run: |
          set -euo pipefail
          uv run python scripts/mobile/generate_protocol_manifest.py --check
          uv run ruff check hermes_mobile tests/mobile/contract \
            tests/mobile/unit/test_audit_store.py \
            tests/mobile/unit/test_runtime_router.py \
            tests/mobile/unit/test_android_manifest_policy.py \
            scripts/mobile scripts/android/verify_android_manifest_policy.py
          uv run ruff format --check hermes_mobile tests/mobile/contract \
            tests/mobile/unit/test_audit_store.py \
            tests/mobile/unit/test_runtime_router.py \
            tests/mobile/unit/test_android_manifest_policy.py \
            scripts/mobile scripts/android/verify_android_manifest_policy.py

      - name: Run protocol and routing contract tests
        run: |
          scripts/run_tests.sh -j 4 tests/mobile/contract \
            tests/mobile/unit/test_audit_store.py \
            tests/mobile/unit/test_runtime_router.py \
            tests/mobile/unit/test_android_manifest_policy.py -q

  bootstrap:
    name: Build, test and inspect PhoneState APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: apps/mobile-bridge-android

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install pinned Android packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Verify vendored Gradle wrapper
        run: |
          set -euo pipefail
          echo "497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
          ./gradlew --version

      - name: Verify source manifest policy
        run: |
          python3 ../../scripts/android/verify_android_manifest_policy.py \
            --network-security-config app/src/main/res/xml/network_security_config.xml \
            --accessibility-service-config app/src/main/res/xml/current_app_accessibility_service.xml \
            --full-backup-rules app/src/main/res/xml/backup_rules.xml \
            --data-extraction-rules app/src/main/res/xml/data_extraction_rules.xml \
            app/src/main/AndroidManifest.xml

      - name: Detect dependency metadata bootstrap
        id: metadata
        run: |
          set -euo pipefail
          if [[ ! -f .dependency-bootstrap && -f gradle/verification-metadata.xml && -f app/gradle.lockfile ]]; then
            echo "bootstrap=false" >> "$GITHUB_OUTPUT"
          else
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate dependency verification and lock metadata
        if: steps.metadata.outputs.bootstrap == 'true'
        run: |
          set -euo pipefail
          ./gradlew --no-daemon \
            --write-locks \
            --write-verification-metadata sha256 \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug \
            :fixture-app:lintDebug \
            :fixture-app:assembleDebug \
            cyclonedxBom

      - name: Build with strict dependency verification
        if: steps.metadata.outputs.bootstrap == 'false'
        run: |
          set -euo pipefail
          ./gradlew --no-daemon \
            --dependency-verification=strict \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug \
            :fixture-app:lintDebug \
            :fixture-app:assembleDebug \
            cyclonedxBom
          git diff --exit-code -- gradle/verification-metadata.xml app/gradle.lockfile gradle.lockfile

      - name: Report Android lint findings
        if: failure()
        run: |
          set -euo pipefail
          mapfile -t reports < <(find app/build -name 'lint-results-*.txt' -type f -print | LC_ALL=C sort)
          for report in "${reports[@]}"; do
            echo "### $report"
            sed -n '1,400p' "$report"
          done

      - name: Collect dependency metadata
        if: always()
        run: |
          set -euo pipefail
          report_dir="build/reports/hmr/dependency-metadata"
          mkdir -p "$report_dir/gradle" "$report_dir/app"
          [[ ! -f gradle/verification-metadata.xml ]] || cp gradle/verification-metadata.xml "$report_dir/gradle/"
          [[ ! -f app/gradle.lockfile ]] || cp app/gradle.lockfile "$report_dir/app/"
          [[ ! -f gradle.lockfile ]] || cp gradle.lockfile "$report_dir/"

      - name: Inspect built APK
        if: success()
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          report_dir="build/reports/hmr/apk"
          mkdir -p "$report_dir"
          apkanalyzer manifest print "$apk" > "$report_dir/AndroidManifest.xml"
          apkanalyzer files list "$apk" | LC_ALL=C sort > "$report_dir/packaged-files.txt"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2" dump resources "$apk" \
            > "$report_dir/resource-table.txt"
          sha256sum "$apk" > "$report_dir/app-debug.apk.sha256"
          python3 ../../scripts/android/verify_android_manifest_policy.py \
            --network-security-config app/src/main/res/xml/network_security_config.xml \
            --accessibility-service-config app/src/main/res/xml/current_app_accessibility_service.xml \
            --full-backup-rules app/src/main/res/xml/backup_rules.xml \
            --data-extraction-rules app/src/main/res/xml/data_extraction_rules.xml \
            --compiled-resource-table "$report_dir/resource-table.txt" \
            "$report_dir/AndroidManifest.xml"
          if grep -Ei '(secret|credential|\.pem$|\.key$|\.p12$|\.jks$|\.keystore$)' "$report_dir/packaged-files.txt"; then
            echo "forbidden secret-like file name found in APK" >&2
            exit 1
          fi

      - name: Collect and validate CycloneDX SBOM
        if: success()
        run: |
          set -euo pipefail
          report_dir="build/reports/hmr/sbom"
          build_source="build/reports/cyclonedx"
          apk_source="app/build/reports/cyclonedx-direct"
          mkdir -p "$report_dir"
          test -f "$build_source/bom.json"
          test -f "$build_source/bom.xml"
          test -f "$apk_source/bom.json"
          test -f "$apk_source/bom.xml"
          cp "$build_source/bom.json" "$report_dir/build-bom.json"
          cp "$build_source/bom.xml" "$report_dir/build-bom.xml"
          cp "$apk_source/bom.json" "$report_dir/apk-bom.json"
          cp "$apk_source/bom.xml" "$report_dir/apk-bom.xml"
          jq -e '
            .bomFormat == "CycloneDX" and
            .metadata.component.type == "application" and
            .metadata.component.name == "hermes-mobile-runtime-android" and
            .metadata.licenses[0].license.name == "MIT" and
            (.components | type == "array")
          ' "$report_dir/apk-bom.json" >/dev/null

      - name: Upload dependency bootstrap metadata
        if: always() && steps.metadata.outputs.bootstrap == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hmr-103-gradle-metadata
          path: apps/mobile-bridge-android/build/reports/hmr/dependency-metadata
          if-no-files-found: error
          retention-days: 7

      - name: Require reviewed dependency metadata
        if: steps.metadata.outputs.bootstrap == 'true'
        run: |
          echo "Generated dependency locks and verification metadata must be reviewed and committed." >&2
          exit 1

      - name: Upload Android review evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hmr-103-android-evidence
          path: |
            apps/mobile-bridge-android/app/build/outputs/apk/debug/app-debug.apk
            apps/mobile-bridge-android/build/reports/hmr/apk
            apps/mobile-bridge-android/build/reports/hmr/sbom
          if-no-files-found: error
          retention-days: 14

  emulator-contract:
    name: Emulator contract (API ${{ matrix.api-level }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 36]
    defaults:
      run:
        shell: bash
        working-directory: apps/mobile-bridge-android

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install build and matrix emulator packages
        env:
          HMR_API_LEVEL: ${{ matrix.api-level }}
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "emulator" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "system-images;android-${HMR_API_LEVEL};google_apis;x86_64"

      - name: Build bridge, fixture and contract APKs
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --dependency-verification=strict \
            :app:assembleDebug \
            :app:assembleDebugAndroidTest \
            :fixture-app:assembleDebug

      - name: Create and boot clean emulator
        env:
          HMR_API_LEVEL: ${{ matrix.api-level }}
        run: |
          set -euo pipefail
          report_dir="build/reports/hmr/emulator/api-${HMR_API_LEVEL}"
          mkdir -p "$report_dir"
          image_dir="$ANDROID_SDK_ROOT/system-images/android-${HMR_API_LEVEL}/google_apis/x86_64"
          find "$image_dir" -type f -name system.img -print -exec sha256sum {} \; \
            > "$report_dir/system-image.sha256"
          test -s "$report_dir/system-image.sha256"
          echo no | avdmanager create avd \
            --force \
            --name "hmr-api-${HMR_API_LEVEL}" \
            --package "system-images;android-${HMR_API_LEVEL};google_apis;x86_64" \
            --device pixel_2
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
          fi
          emulator \
            -avd "hmr-api-${HMR_API_LEVEL}" \
            -no-window \
            -no-snapshot \
            -noaudio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            > "$report_dir/emulator.log" 2>&1 &
          echo $! > "$report_dir/emulator.pid"
          timeout 240 bash -c '
            adb wait-for-device
            until [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == "1" ]]; do
              sleep 2
            done
          '
          adb shell input keyevent 82
          adb shell settings put secure show_ime_with_hard_keyboard 1
          adb shell getprop > "$report_dir/device-properties.txt"

      - name: Run clean grant/revoke and recovery contracts
        env:
          HMR_API_LEVEL: ${{ matrix.api-level }}
        run: |
          set -euo pipefail
          report_dir="build/reports/hmr/emulator/api-${HMR_API_LEVEL}"
          bridge_apk="app/build/outputs/apk/debug/app-debug.apk"
          contract_apk="app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
          fixture_apk="fixture-app/build/outputs/apk/debug/fixture-app-debug.apk"
          runner="ai.hermes.mobile.runtime.test/ai.hermes.mobile.runtime.bridge.EmulatorContractInstrumentation"
          service="ai.hermes.mobile.runtime/ai.hermes.mobile.runtime.bridge.accessibility.CurrentAppAccessibilityService"

          adb install --no-streaming "$bridge_apk"
          adb install --no-streaming "$contract_apk"
          adb install --no-streaming "$fixture_apk"

          adb shell am instrument -w -r -e mode ungranted "$runner" \
            | tee "$report_dir/ungranted.txt"
          grep -Fq "HMR_CONTRACT_STATUS=PASSED" "$report_dir/ungranted.txt"

          adb shell settings put secure enabled_accessibility_services "$service"
          adb shell settings put secure accessibility_enabled 1
          sleep 2
          adb shell am instrument -w -r -e mode granted "$runner" \
            | tee "$report_dir/granted.txt"
          grep -Fq "HMR_CONTRACT_STATUS=PASSED" "$report_dir/granted.txt"

          adb shell settings delete secure enabled_accessibility_services
          adb shell settings put secure accessibility_enabled 0
          sleep 2
          adb shell am instrument -w -r -e mode ungranted "$runner" \
            | tee "$report_dir/revoked.txt"
          grep -Fq "HMR_CONTRACT_STATUS=PASSED" "$report_dir/revoked.txt"

      - name: Collect emulator evidence
        if: always()
        env:
          HMR_API_LEVEL: ${{ matrix.api-level }}
        run: |
          set -euo pipefail
          report_dir="build/reports/hmr/emulator/api-${HMR_API_LEVEL}"
          mkdir -p "$report_dir"
          adb logcat -d -v threadtime > "$report_dir/logcat.txt" || true
          adb shell dumpsys accessibility > "$report_dir/accessibility.txt" || true
          adb shell dumpsys window > "$report_dir/window.txt" || true

      - name: Upload emulator contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hmr-113-emulator-api-${{ matrix.api-level }}
          path: apps/mobile-bridge-android/build/reports/hmr/emulator/api-${{ matrix.api-level }}
          if-no-files-found: error
          retention-days: 14
